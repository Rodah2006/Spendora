<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>
<body>


    <form action="">

<legend>Join us and start your journey today!!!</legend>

<br>

<label for="fullname">Full Name:</label>
<input type="text" placeholder="e.g John Doe" id="fullname" required>
<br><br>


<label for="email">Email Address:</label>
<input type="email" placeholder="e.g abc@gmail.com" id="email" required>
<br><br>


<label for="pwd">Password:</label>
<input type="password" placeholder="type password" required>
<br><br>

<label for="yob">Year of birth:</label>
<input type="date" id="yob" required>
<br><br>

<label for="dt">Date and Time:</label>
<input type="datetime-local" id="dt" required>
<br><br>

<label for="phone">Contacts:</label>
<input type="tel" id="phone" placeholder=+254712345678" required>
<br><br>

<label for="file">Upload file:</label>
<input type="file" id="file" required>
<br><br>

<!....DropDown..>

<!...RadioButton..>

<!...Checkbox..>

<!...Textarea..>

<button>Register</button>



















    </form>















    
</body>
</html>
